<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="240" fill="none">
  <defs>
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent-cyan-blue-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="badge-pill-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <style>
    .title-light { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 34px; fill: #0f172a; letter-spacing: -0.5px; }
    .tagline-light { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 14.5px; fill: #475569; }
    .pill-text-light { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #0369a1; letter-spacing: 0.8px; text-transform: uppercase; }
    .chip-text-light { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #334155; }
    .chip-dot-green { fill: #059669; }
    .chip-dot-blue { fill: #0284c7; }
    .chip-dot-purple { fill: #7c3aed; }
    .chip-dot-amber { fill: #d97706; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="240" rx="14" fill="url(#bg-grad-light)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Decorative Geometry -->
  <circle cx="900" cy="40" r="130" fill="#0284c7" opacity="0.05"/>
  <circle cx="80" cy="200" r="100" fill="#4f46e5" opacity="0.05"/>

  <!-- Top Role Pill -->
  <g transform="translate(48, 30)">
    <rect width="320" height="26" rx="13" fill="url(#badge-pill-light)" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#0284c7"/>
    <text x="28" y="17" class="pill-text-light">Senior Fullstack &amp; QA Automation</text>
  </g>

  <!-- Main Name Header -->
  <g transform="translate(48, 92)">
    <text x="0" y="0" class="title-light">Eduardo Maytorena <tspan fill="url(#accent-cyan-blue-light)">(@Eduardomr1)</tspan></text>
  </g>

  <!-- Tagline / Value Proposition -->
  <g transform="translate(48, 128)">
    <text x="0" y="0" class="tagline-light">Clean Architecture SaaS  •  Offline-First Mobile  •  Deterministic QA  •  TypeScript AST Linters</text>
    <text x="0" y="24" class="tagline-light">Construyendo software resiliente y suites de verificación con cero falsos positivos.</text>
  </g>

  <!-- Quick Metrics / Architecture Badges -->
  <g transform="translate(48, 184)">
    <!-- Chip 1: Strict TS -->
    <rect x="0" y="0" width="168" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" class="chip-dot-blue"/>
    <text x="26" y="18" class="chip-text-light">TypeScript Strict (0% Any)</text>

    <!-- Chip 2: Zero Flaky Tests -->
    <rect x="180" y="0" width="160" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="194" cy="14" r="4" class="chip-dot-green"/>
    <text x="206" y="18" class="chip-text-light">Playwright &amp; Maestro POM</text>

    <!-- Chip 3: AST & SARIF -->
    <rect x="352" y="0" width="160" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="366" cy="14" r="4" class="chip-dot-purple"/>
    <text x="378" y="18" class="chip-text-light">AST Linter (SARIF v2.1.0)</text>

    <!-- Chip 4: WCAG 2.1 AA -->
    <rect x="524" y="0" width="154" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="538" cy="14" r="4" class="chip-dot-green"/>
    <text x="550" y="18" class="chip-text-light">WCAG 2.1 AA A11y Suite</text>

    <!-- Chip 5: Offline First -->
    <rect x="690" y="0" width="160" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="704" cy="14" r="4" class="chip-dot-amber"/>
    <text x="716" y="18" class="chip-text-light">Offline-First &amp; 98% Cov</text>
  </g>
</svg>
