<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="240" fill="none">
  <defs>
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="accent-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="badge-pill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 34px; fill: #ffffff; letter-spacing: -0.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 14.5px; fill: #94a3b8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #38bdf8; letter-spacing: 0.8px; text-transform: uppercase; }
    .chip-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 11px; fill: #cbd5e1; }
    .chip-dot { fill: #10b981; }
    .cyan-dot { fill: #38bdf8; }
    .purple-dot { fill: #a855f7; }
    .amber-dot { fill: #f59e0b; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="240" rx="14" fill="url(#bg-grad-dark)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Decorative Subtle Grid & Geometry -->
  <circle cx="900" cy="40" r="130" fill="#38bdf8" opacity="0.04" filter="url(#glow)"/>
  <circle cx="80" cy="200" r="100" fill="#818cf8" opacity="0.04" filter="url(#glow)"/>

  <!-- Top Role Pill -->
  <g transform="translate(48, 30)">
    <rect width="320" height="26" rx="13" fill="url(#badge-pill)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#38bdf8"/>
    <text x="28" y="17" class="pill-text">Senior Fullstack &amp; QA Automation</text>
  </g>

  <!-- Main Name Header -->
  <g transform="translate(48, 92)">
    <text x="0" y="0" class="title">Eduardo Maytorena <tspan fill="url(#accent-cyan-blue)">(@Eduardomr1)</tspan></text>
  </g>

  <!-- Tagline / Value Proposition -->
  <g transform="translate(48, 128)">
    <text x="0" y="0" class="tagline">Clean Architecture SaaS  •  Offline-First Mobile  •  Deterministic QA  •  TypeScript AST Linters</text>
    <text x="0" y="24" class="tagline">Construyendo software resiliente y suites de verificación con cero falsos positivos.</text>
  </g>

  <!-- Quick Metrics / Architecture Badges -->
  <g transform="translate(48, 184)">
    <!-- Chip 1: Strict TS -->
    <rect x="0" y="0" width="168" height="28" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" class="cyan-dot"/>
    <text x="26" y="18" class="chip-text">TypeScript Strict (0% Any)</text>

    <!-- Chip 2: Zero Flaky Tests -->
    <rect x="180" y="0" width="160" height="28" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="194" cy="14" r="4" class="chip-dot"/>
    <text x="206" y="18" class="chip-text">Playwright &amp; Maestro POM</text>

    <!-- Chip 3: AST & SARIF -->
    <rect x="352" y="0" width="160" height="28" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="366" cy="14" r="4" class="purple-dot"/>
    <text x="378" y="18" class="chip-text">AST Linter (SARIF v2.1.0)</text>

    <!-- Chip 4: WCAG 2.1 AA -->
    <rect x="524" y="0" width="154" height="28" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="538" cy="14" r="4" class="chip-dot"/>
    <text x="550" y="18" class="chip-text">WCAG 2.1 AA A11y Suite</text>

    <!-- Chip 5: Offline First -->
    <rect x="690" y="0" width="160" height="28" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="704" cy="14" r="4" class="amber-dot"/>
    <text x="716" y="18" class="chip-text">Offline-First &amp; 98% Cov</text>
  </g>
</svg>
